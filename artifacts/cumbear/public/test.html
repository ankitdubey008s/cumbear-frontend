<!DOCTYPE html>
<html>
<head>
    <title>Cumbear Proxy Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: black; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; }
        h1 { font-size: 20px; margin-bottom: 16px; color: #e91e63; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .video-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .video-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .info { padding: 12px; }
        .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .views { font-size: 12px; color: #888; }
        .provider { font-size: 11px; color: #e91e63; margin-top: 4px; }
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <h1>🎬 Cumbear - 2000+ Providers</h1>
    <div id="videos" class="loading">Loading 100+ viral videos...</div>

    <script>
        async function loadVideos() {
            try {
                const response = await fetch('http://localhost:3001/api/videos?query=popular&per_page=48');
                const data = await response.json();
                const container = document.getElementById('videos');
                
                if (data.videos && data.videos.length > 0) {
                    container.className = 'video-grid';
                    container.innerHTML = data.videos.map(video => `
                        <div class="video-card" onclick="window.open('${video.embed_url || '#'}', '_blank')">
                            <img src="${video.thumb}" alt="${video.title}" onerror="this.src='https://picsum.photos/320/180'">
                            <div class="info">
                                <div class="title">${video.title.substring(0, 60)}</div>
                                <div class="views">👁️ ${(video.views || 0).toLocaleString()} views</div>
                                <div class="provider">⭐ ${video.uploader || 'Premium Provider'}</div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="loading">No videos available. Check proxy connection.</div>';
                }
            } catch (error) {
                document.getElementById('videos').innerHTML = `<div class="loading">Error: ${error.message}<br>Make sure proxy is running on port 3001</div>`;
            }
        }
        
        loadVideos();
    </script>
</body>
</html>
